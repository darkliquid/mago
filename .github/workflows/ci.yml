name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run lint checks
        run: mise run lint

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: cc
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build runtime library
        env:
          CC: ${{ matrix.cc }}
        run: mise run build-lib

      - name: Build packages
        run: mise run build

      - name: Run tests
        env:
          CC: ${{ matrix.cc }}
        run: mise run test

      - name: Build examples
        run: go build ./examples/...

      - name: Upload runtime library artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-lib-${{ runner.os }}-${{ runner.arch }}
          path: internal/lib/
