name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base}"
            fi
            files=$(git diff --name-only "${base}" HEAD)
          else
            files=$(git diff --name-only HEAD^ HEAD)
          fi

          printf 'Changed files:\n%s\n' "${files}"

          go=false
          native=false
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            case "${file}" in
              *.go | go.mod | go.sum | .golangci.yml | mise.toml | examples/*)
                go=true
                ;;
            esac
            case "${file}" in
              native/* | internal/buildlib/* | internal/gen/* | mise.toml | embed_*.go | zz_generated.bindings.go)
                native=true
                ;;
            esac
          done <<< "${files}"

          echo "go=${go}" >> "${GITHUB_OUTPUT}"
          echo "native=${native}" >> "${GITHUB_OUTPUT}"
          echo "Skipping lint/test: ${go}; skipping test and embed verification: ${native}"

  lint:
    name: Lint
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run lint checks
        run: mise run lint

  verify-embeds:
    name: Verify embeds
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise (Go)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Download miniaudio header for checksum
        run: go run ./internal/cmd/buildlib -download-only miniaudio.h

      - name: Check embed cache
        id: embed-cache
        uses: actions/cache@v4
        with:
          path: .buildlib-cache-marker
          key: embeds-v1-${{ hashFiles('native/miniaudio_bridge.c', 'miniaudio.h', 'internal/buildlib/**', 'internal/gen/**', 'mise.toml') }}

      - name: Set up osxcross Docker container
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t dockercross/osxcross:latest - << 'EOF'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y clang libxml2-dev libssl-dev && rm -rf /var/lib/apt/lists/*
          COPY --from=crazymax/osxcross /osxcross /osxcross
          ENV PATH="/osxcross/bin:$PATH"
          ENV LD_LIBRARY_PATH="/osxcross/lib:$LD_LIBRARY_PATH"
          EOF

      - name: Build runtime library for all targets
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: mise run build-lib-all

      - name: Run code generation
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: mise run generate

      - name: Verify embeds match repository
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: git diff --exit-code

      - name: Create embed cache marker
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: touch .buildlib-cache-marker

  test:
    name: Test (${{ matrix.os }})
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Build examples
        run: go build -trimpath ./examples/...
